name: Build AML Mod

# build .so ด้วย ndk-build จาก mod/Android.mk + mod/Application.mk
# (เขียนเอง ไม่ได้พึ่ง aml-psdk แล้ว เพราะ milestone 1 เรียกฟังก์ชันเกมตรงๆ
#  ผ่านที่อยู่จริงที่ยืนยันแล้วจาก libGTASA.so ของคุณ — ดู docs/findings.md)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (รวม submodule เผื่อ aml-psdk ถูกใส่เป็น submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ติดตั้ง Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Build ด้วย ndk-build
        run: |
          "${{ steps.setup-ndk.outputs.ndk-path }}/ndk-build" \
            NDK_PROJECT_PATH=$(pwd)/mod \
            APP_BUILD_SCRIPT=$(pwd)/mod/Android.mk \
            NDK_APPLICATION_MK=$(pwd)/mod/Application.mk \
            -j"$(nproc)"

      - name: อัปโหลดไฟล์ .so ที่ build ได้
        uses: actions/upload-artifact@v4
        with:
          name: mc_zombie_mod-${{ github.sha }}
          path: mod/libs/**/*.so
          if-no-files-found: error
